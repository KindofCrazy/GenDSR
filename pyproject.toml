[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gendsr"
version = "0.1.0"
description = "Wan feature fusion for dynamic spatial reasoning with Qwen3-VL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "torch>=2.9,<2.10"]

[project.optional-dependencies]
sft = ["transformers>=5.10,<5.11", "accelerate>=1.7", "decord>=0.6", "torchvision>=0.24,<0.25", "datasets>=3", "pyarrow>=18", "pillow>=10", "safetensors>=0.5"]
test = ["pytest>=8"]

[project.scripts]
gendsr-prepare = "gendsr.data:main"
gendsr-extract = "gendsr.wan:main"
gendsr-train = "gendsr.train:main"
gendsr-eval = "gendsr.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
